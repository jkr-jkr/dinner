<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dinner">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --ink2:#3c3c43; --muted:#8e8e93; --sep:rgba(60,60,67,.12);
    --tint:#007aff; --tint-soft:rgba(0,122,255,.12); --ph1:#e9e4dc; --ph2:#d8d1c5;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf5; --muted:#8e8e93; --sep:rgba(84,84,88,.4);
      --tint:#0a84ff; --tint-soft:rgba(10,132,255,.18); --ph1:#2c2c2e; --ph2:#3a3a3c; --shadow:none; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:max(28px,calc(env(safe-area-inset-top) + 12px)) 22px max(40px,calc(env(safe-area-inset-bottom) + 16px))}
  main{max-width:520px;margin:0 auto}
  .screen{display:none;animation:fade .18s ease}.screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.4px;margin:10px 0 4px}
  .sub{color:var(--muted);font-size:16px;margin:0 0 22px}
  .section{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:26px 2px 10px}
  .back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--tint);font-size:17px;padding:6px 0;margin:0 0 6px;cursor:pointer;font-family:inherit}
  .back svg{width:12px;height:20px}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;cursor:pointer;background:var(--card);color:var(--tint);font-family:inherit;box-shadow:var(--shadow);margin-top:12px}
  .btn.primary{background:var(--tint);color:#fff}
  .btn.ghost{background:transparent;box-shadow:none;color:var(--muted);font-weight:500}
  .btn:active{opacity:.7}

  /* segmented control */
  .seg{display:flex;background:rgba(118,118,128,.12);border-radius:12px;padding:3px;margin:-6px 0 16px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;padding:10px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  @media (prefers-color-scheme: dark){ .seg{background:rgba(118,118,128,.24)} .seg button.on{background:#636366} }
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  /* A–Z index (All meals) */
  .indexed{padding-right:22px}
  .azhead{font-size:15px;font-weight:600;color:var(--muted);margin:22px 2px 8px;letter-spacing:.02em}
  .azhead:first-child{margin-top:0}
  .azbar{position:fixed;right:max(4px,env(safe-area-inset-right));top:54%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:12px;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
  .azbar span{font-size:11px;line-height:1.75;font-weight:600;color:var(--tint);width:16px;text-align:center}
  .azbar span.off{color:var(--muted);opacity:.45}
  .azbar.active{background:rgba(118,118,128,.18)}
  .azbubble{position:fixed;right:44px;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--ink);z-index:6;pointer-events:none}
  .azbubble.on{display:flex}
  /* theme tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;border:0;padding:0;cursor:pointer;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--ph1),var(--ph2))}
  .tile.plain{background:#c7c7cc}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.9}
  .tile .label{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;text-align:left;color:#fff;font-size:20px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.55));letter-spacing:-.2px}
  .tile .label small{display:block;font-size:13px;font-weight:500;opacity:.85}

  /* meal cards */
  .meal{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
  .meal .photo{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--ph1),var(--ph2))}
  .meal .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .meal .photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px}
  .meal .body{padding:22px 20px 22px}
  .meal h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.3px}
  .meal .note{color:var(--muted);font-size:15px;margin:2px 0 12px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .act{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
  .act.pick{background:var(--tint);color:#fff}
  .act.info{background:var(--tint-soft);color:var(--tint)}
  .act:active{opacity:.7}

  /* info / proposal */
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px;margin-bottom:12px}
  .card h2{margin:0;font-size:22px;letter-spacing:-.3px}
  .card .note{color:var(--muted);font-size:15px;margin:2px 0 10px}
  .ing{list-style:none;margin:0;padding:0}
  .ing li{padding:11px 0;border-bottom:1px solid var(--sep);font-size:17px}
  .ing li:last-child{border-bottom:0}
  .pill{display:inline-block;background:var(--tint-soft);color:var(--tint);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;margin-bottom:8px}
  .mini{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;margin-bottom:10px}
  .mini .thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--ph1),var(--ph2));position:relative}
  .mini .thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .mini .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
  .mini .t{flex:1}.mini .t b{display:block;font-size:17px}.mini .t span{color:var(--muted);font-size:14px}
  .mini .x{background:none;border:0;color:var(--muted);font-size:22px;padding:6px 8px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(10px);background:rgba(28,28,30,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:all .2s;pointer-events:none;backdrop-filter:blur(10px)}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<main>

<!-- HOME -->
<section id="home" class="screen">
  <h1 id="homeTitle">What's for dinner?</h1>
  <p class="sub">Pick a dish type, mood or see a full list</p>
  <div class="seg" role="tablist"><button id="segType" onclick="setKind('type')">Dish</button><button id="segMood" onclick="setKind('mood')">Mood</button></div>
  <div class="tiles" id="tiles"></div>
  <button class="btn primary" onclick="openAll()">See full list</button>
</section>

<!-- ALL -->
<section id="all" class="screen">
  <button class="back" onclick="go('home')"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Back</button>
  <h1>All meals</h1>
  <p class="sub">A–Z. Pick one, or tap Info for the ingredients.</p>
  <div id="allList" class="indexed"></div>
  <div class="azbar" id="azbar"></div>
  <div class="azbubble" id="azbubble"></div>
</section>

<!-- THEME -->
<section id="theme" class="screen">
  <button class="back" onclick="go('home')"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Back</button>
  <h1 id="themeTitle"></h1>
  <p class="sub">Pick one, or tap Info for the ingredients.</p>
  <div id="mealList"></div>
</section>

<!-- INFO -->
<section id="info" class="screen">
  <button class="back" onclick="history.back()"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Back</button>
  <div id="infoCard"></div>
  <button class="btn primary" onclick="copyIngredients()">Copy ingredients</button>
  <button class="btn" onclick="pickFromInfo()">Pick this meal</button>
</section>

<!-- PROPOSAL -->
<section id="proposal" class="screen">
  <button class="back" onclick="go('home')"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Home</button>
  <h1>Your pick</h1>
  <p class="sub">Send it as a message.</p>
  <div id="proposalCards"></div>
  <button class="btn" id="altBtn" onclick="go('home')">Add an alternative</button>
  <button class="btn primary" onclick="share()">Share</button>
  <button class="btn ghost" onclick="copyLink()">Copy link only</button>
</section>

<!-- RECEIVED -->
<section id="received" class="screen">
  <h1 id="recvTitle">What's for dinner?</h1>
  <p class="sub" id="recvSub"></p>
  <div id="recvCards"></div>
  <button class="btn ghost" onclick="location.href=location.pathname">Make my own pick</button>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
// ---------- Themes (filters) ----------
// cover: any image path, or null for a plain grey tile
const THEMES = [
  // kind:'type' = dish type, kind:'mood' = theme/feeling. cover: image path or null (grey tile)
  { id:'soup',   kind:'type', name:'Soup',   emoji:'🥣', cover:'img/vyvar.jpg' },
  { id:'salad',  kind:'type', name:'Salad',  emoji:'🥗', cover:'img/pumpkin-salad.jpg' },
  { id:'pasta',  kind:'type', name:'Pasta',  emoji:'🍝', cover:'img/carbonara.jpg' },
  { id:'rice',   kind:'type', name:'Rice',   emoji:'🍚', cover:'img/beetroot-risotto.jpg' },
  { id:'meat',   kind:'type', name:'Meat',   emoji:'🥩', cover:'img/kure-kase.jpg' },
  { id:'fish',   kind:'type', name:'Fish',   emoji:'🐟', cover:'img/teriyaki-salmon.jpg' },
  { id:'veggie', kind:'type', name:'Veggie', emoji:'🥦', cover:'img/pecene-lilky.jpg' },
  { id:'oven',   kind:'type', name:'Oven',   emoji:'🔥', cover:'img/rajcata-burrata.jpg' },
  { id:'czech',  kind:'type', name:'Czech',  emoji:'🇨🇿', cover:'img/rajska.jpg' },
  { id:'bread',  kind:'type', name:'Bread',  emoji:'🍞', cover:'img/avocado-toast.jpg' },
  { id:'quick',   kind:'mood', name:'Quick',   emoji:'⚡', cover:'img/carbonara.jpg' },
  { id:'comfy',   kind:'mood', name:'Comfy',   emoji:'🛋️', cover:'img/kure-kase.jpg' },
  { id:'healthy', kind:'mood', name:'Healthy', emoji:'🌿', cover:'img/avo-asparagus.jpg' },
  { id:'new',     kind:'mood', name:'New',     emoji:'✨', cover:'img/new-cover.jpg' },
];

// ---------- Meals ----------
// Photo convention: img/<meal id>.jpg   Tags = which themes the meal shows under.
const TBC = ['TBC'];
const MEALS = [
  { id:'vyvar', name:'Vývar', tags:['soup','comfy','healthy'], ingredients:TBC },
  { id:'potato-soup', name:'Bramboračka', tags:['soup','czech','comfy'], ingredients:TBC },
  { id:'cesnecka', name:'Česnečka', tags:['soup','czech','comfy','healthy'], ingredients:['Garlic (1 head)','Potatoes (3–4)','Stock or bouillon cubes','Eggs (2)','Bread for croutons','Marjoram','Caraway seeds','Butter or lard'] },
  { id:'cockova', name:'Čočková', tags:['soup','czech'], ingredients:TBC },
  { id:'pumpkin-soup', name:'Dýňová', tags:['soup'], ingredients:TBC },
  { id:'zelnacka', name:'Zelňačka', tags:['soup','czech','comfy','healthy'], ingredients:TBC },
  { id:'bowl', name:'Bowl', tags:['salad','comfy','healthy'], ingredients:TBC },
  { id:'pepper-goat', name:'Goat cheese salad', tags:['salad','quick','healthy'], ingredients:TBC },
  { id:'pumpkin-salad', name:'Pumpkin salad', tags:['salad','healthy'], ingredients:TBC },
  { id:'caprese', name:'Caprese', tags:['salad','quick','healthy'], ingredients:TBC },
  { id:'avo-asparagus', name:'Avo asparagus salad', tags:['salad','healthy'], ingredients:TBC },
  { id:'greek-salad', name:'Greek salad', tags:['salad','healthy'], ingredients:TBC },
  { id:'carbonara', name:'Carbonara', tags:['pasta','quick','comfy'], ingredients:TBC },
  { id:'bolognese', name:'Bolognese', tags:['pasta','comfy'], ingredients:TBC },
  { id:'gnocchi-anchovy', name:'Gnocchi anchovy', tags:['pasta','quick'], ingredients:TBC },
  { id:'gnocchi-sage', name:'Gnocchi sage', tags:['pasta'], ingredients:TBC },
  { id:'rajska', name:'Rajská', tags:['pasta','czech','comfy'], ingredients:TBC },
  { id:'aglio-olio', name:'Aglio, Olio & krevety', tags:['pasta','quick'], ingredients:TBC },
  { id:'pizza', name:'Homemade pizza', tags:['pasta','oven','quick','comfy'], ingredients:TBC },
  { id:'beetroot-risotto', name:'Beetroot risotto', tags:['rice','comfy'], ingredients:TBC },
  { id:'mushroom-risotto', name:'Mushroom risotto', tags:['rice'], ingredients:TBC },
  { id:'asparagus-risotto', name:'Asparagus risotto', tags:['rice'], ingredients:TBC },
  { id:'chicken-teriyaki', name:'Chicken teriyaki', tags:['rice'], ingredients:TBC },
  { id:'rice-curry', name:'Rice & curry', tags:['rice'], ingredients:TBC },
  { id:'fried-rice', name:'Fried rice', tags:['rice'], ingredients:TBC },
  { id:'burgers', name:'Burger', tags:['meat','quick','comfy'], ingredients:['Minced beef (500 g)','Burger buns (4)','Cheddar slices','Onion (1)','Tomato (1)','Lettuce','Pickles','Ketchup / mustard'] },
  { id:'ribeye', name:'Steak', tags:['meat','comfy'], ingredients:TBC },
  { id:'kure-kase', name:'Kuře s kaší', tags:['meat','czech','comfy'], ingredients:TBC },
  { id:'kure-brambor', name:'Kuře brambor', tags:['meat','oven','quick','comfy'], ingredients:TBC },
  { id:'kachna', name:'Kachna', tags:['meat'], ingredients:TBC },
  { id:'fajitas', name:'Fajitas', tags:['meat','comfy'], ingredients:TBC },
  { id:'veprove-mrkev', name:'Dušená mrkev', tags:['meat','czech','comfy'], ingredients:TBC },
  { id:'slow-roast', name:'Slow roast', tags:['meat','oven','comfy'], ingredients:TBC },
  { id:'teriyaki-salmon', name:'Teriyaki salmon', tags:['fish'], ingredients:TBC },
  { id:'losos-brambor', name:'Losos brambor', tags:['fish','quick','healthy'], ingredients:TBC },
  { id:'cod-mash', name:'Treska s kaší', tags:['fish','comfy','healthy'], ingredients:TBC },
  { id:'treska-polenta', name:'Treska polenta', tags:['fish','healthy'], ingredients:TBC },
  { id:'tuna-steak', name:'Tuna steak', tags:['fish','healthy'], ingredients:TBC },
  { id:'shrimp-curry', name:'Shrimp curry', tags:['fish'], ingredients:TBC },
  { id:'octopus', name:'Octopus', tags:['fish','healthy'], ingredients:TBC },
  { id:'pecene-lilky', name:'Pečené lilky', tags:['veggie','oven','comfy','healthy'], ingredients:TBC },
  { id:'plnene-papriky', name:'Plněné papriky', tags:['veggie','comfy'], ingredients:TBC },
  { id:'spenat-brambor', name:'Špenát brambor', tags:['veggie','czech','quick','comfy'], ingredients:TBC },
  { id:'cocka-vejce', name:'Čočka s vejcem', tags:['veggie','czech','quick','comfy'], ingredients:TBC },
  { id:'dal-makhani', name:'Dal makhani', tags:['veggie','comfy'], ingredients:TBC },
  { id:'smazeny-kvetak', name:'Smažený květák', tags:['veggie','czech'], ingredients:TBC },
  { id:'leco', name:'Lečo', tags:['veggie','czech','quick','comfy','healthy'], ingredients:TBC },
  { id:'rajcata-burrata', name:'Rajčata s burratou', tags:['oven','quick','healthy'], ingredients:TBC },
  { id:'noky-mak', name:'Noky s mákem', tags:['czech','quick'], ingredients:TBC },
  { id:'chleba-sunka', name:'Chleba se šunkou', tags:['bread','quick'], ingredients:TBC },
  { id:'topinky-syr', name:'Topinky se sýrem', tags:['bread','quick'], ingredients:TBC },
  { id:'chleba-vajicko', name:'Chleba ve vajíčku', tags:['bread','quick'], ingredients:TBC },
  { id:'avocado-toast', name:'Avocado toast', tags:['bread','quick','healthy'], ingredients:TBC },
];
// Display order inside each dish type (moods fall back to A–Z)
const ORDER = {
  soup:['vyvar','potato-soup','cesnecka','cockova','pumpkin-soup','zelnacka'],
  salad:['bowl','pepper-goat','pumpkin-salad','caprese','avo-asparagus','greek-salad'],
  pasta:['carbonara','bolognese','gnocchi-anchovy','gnocchi-sage','rajska','aglio-olio','pizza'],
  rice:['beetroot-risotto','mushroom-risotto','asparagus-risotto','chicken-teriyaki','rice-curry','fried-rice'],
  meat:['burgers','ribeye','kure-kase','kure-brambor','kachna','fajitas','veprove-mrkev','slow-roast'],
  fish:['teriyaki-salmon','losos-brambor','cod-mash','treska-polenta','tuna-steak','shrimp-curry','octopus'],
  veggie:['pecene-lilky','plnene-papriky','spenat-brambor','cocka-vejce','dal-makhani','smazeny-kvetak','leco'],
  oven:['rajcata-burrata','kure-brambor','pecene-lilky','slow-roast','pizza'],
  czech:['potato-soup','cesnecka','cockova','zelnacka','rajska','veprove-mrkev','cocka-vejce','kure-kase','spenat-brambor','smazeny-kvetak','noky-mak','leco'],
  bread:['chleba-sunka','topinky-syr','chleba-vajicko','avocado-toast'],
};

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const meal = id => MEALS.find(m=>m.id===id);
const theme = id => THEMES.find(t=>t.id===id);
const inTheme = t => MEALS.filter(m=>m.tags.includes(t));
const byName = (a,b) => a.name.localeCompare(b.name,'cs');
const emojiFor = m => (theme(m.tags[0])||{}).emoji || '🍽️';
const img = (src, emoji) => `<img src="${src}" alt="" onerror="this.nextElementSibling.style.display='flex';this.remove()"><div class="ph" style="display:none">${emoji}</div>`;
function mealTime(){ const d=new Date(); return (d.getDay()===0||d.getDay()===6) && d.getHours()<14 ? 'lunch' : 'dinner'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); history.pushState({s:id},''); }
window.addEventListener('popstate', e=>{ const s=(e.state&&e.state.s)||'home'; document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on')); $(s).classList.add('on'); });

let infoOf = null;   // meal shown on Info
let picks = [];      // meal ids, max 2

// ---------- Rendering ----------
function mealCard(m){
  return `<div class="meal"><div class="photo">${img('img/'+m.id+'.jpg', emojiFor(m))}</div><div class="body"><h2>${m.name}</h2>
    <div class="actions"><button class="act pick" onclick="pick('${m.id}')">Pick</button><button class="act info" onclick="openInfo('${m.id}')">Info</button></div></div></div>`;
}
let kind = 'type';
try{ kind = localStorage.getItem('kind') || 'type'; }catch(e){}
function setKind(k){ kind=k; try{ localStorage.setItem('kind',k); }catch(e){} renderHome(); }
function renderHome(){
  $('homeTitle').textContent = `What's for ${mealTime()}?`;
  $('segType').classList.toggle('on',kind==='type'); $('segMood').classList.toggle('on',kind==='mood');
  $('tiles').innerHTML = THEMES.filter(t=>t.kind===kind).map(t=>{ const n=inTheme(t.id).length; return `<button class="tile${t.cover?'':' plain'}" onclick="openTheme('${t.id}')">${t.cover?img(t.cover, t.emoji):''}<div class="label">${t.name}<small>${n} meal${n===1?'':'s'}</small></div></button>`; }).join('');
}
function openTheme(id){ const t=theme(id); $('themeTitle').textContent=t.name; const ms=ORDER[id]?ORDER[id].map(meal).filter(Boolean):inTheme(id).sort(byName); $('mealList').innerHTML=ms.length?ms.map(mealCard).join(''):'<p class="empty">No meals here yet.</p>'; go('theme'); }
const fold = str => str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function openAll(){
  const sorted=[...MEALS].sort((a,b)=>fold(a.name).localeCompare(fold(b.name)));
  const groups={}; sorted.forEach(m=>{ const L=fold(m.name)[0]; (groups[L]=groups[L]||[]).push(m); });
  $('allList').innerHTML = LETTERS.filter(L=>groups[L]).map(L=>`<div class="azhead" id="az-${L}">${L}</div>`+groups[L].map(mealCard).join('')).join('');
  $('azbar').innerHTML = LETTERS.map(L=>`<span data-l="${L}" class="${groups[L]?'':'off'}">${L}</span>`).join('');
  go('all');
}
(function(){
  const bar=$('azbar'), bub=$('azbubble'); let last=null;
  function jump(L){
    // nearest section at or after L
    const i=LETTERS.indexOf(L); let el=null;
    for(let k=i;k<LETTERS.length&&!el;k++) el=$('az-'+LETTERS[k]);
    if(!el) return;
    bub.textContent=L; bub.classList.add('on');
    if(L!==last){ last=L; const y=el.getBoundingClientRect().top+window.scrollY-12; window.scrollTo({top:y,behavior:'auto'}); if(navigator.vibrate) navigator.vibrate(3); }
  }
  function at(e){ const t=document.elementFromPoint(bar.getBoundingClientRect().left+8, e.clientY); return t&&t.dataset&&t.dataset.l; }
  bar.addEventListener('pointerdown',e=>{ bar.setPointerCapture(e.pointerId); bar.classList.add('active'); const L=at(e); if(L) jump(L); e.preventDefault(); });
  bar.addEventListener('pointermove',e=>{ if(!bar.classList.contains('active')) return; const L=at(e); if(L) jump(L); });
  const end=()=>{ bar.classList.remove('active'); bub.classList.remove('on'); last=null; };
  bar.addEventListener('pointerup',end); bar.addEventListener('pointercancel',end);
})();
function openInfo(id){ infoOf=meal(id); $('infoCard').innerHTML=`<div class="card"><h2>${infoOf.name}</h2><ul class="ing" style="margin-top:10px">${infoOf.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul></div>`; go('info'); }

// ---------- Ingredients → Notes ----------
async function copyIngredients(){ const s=`${infoOf.name}\n`+infoOf.ingredients.map(i=>'• '+i).join('\n'); try{ await navigator.clipboard.writeText(s); toast('Copied — paste into Notes'); }catch(e){ prompt('Copy this:', s); } }

// ---------- Pick → share ----------
function pick(id){ if(!picks.includes(id)) picks.push(id); picks=picks.slice(-2); renderProposal(); go('proposal'); }
function pickFromInfo(){ pick(infoOf.id); }
function removePick(i){ picks.splice(i,1); if(!picks.length) return go('home'); renderProposal(); }
function renderProposal(){
  $('proposalCards').innerHTML = picks.map((id,i)=>{ const m=meal(id); return `<div class="mini"><div class="thumb">${img('img/'+m.id+'.jpg', emojiFor(m))}</div><div class="t"><b>${m.name}</b><span>${picks.length>1?'Option '+(i+1):''}</span></div><button class="x" onclick="removePick(${i})" aria-label="Remove">×</button></div>`; }).join('');
  $('altBtn').style.display = picks.length>=2?'none':'flex';
}
function buildLink(){ const u=new URL(location.href); u.search=''; u.hash=''; u.searchParams.set('p', picks.join(',')); return u.toString(); }
function buildText(){ return `What's for ${mealTime()}? ${picks.map(id=>meal(id).name).join(' or ')} → `; }
async function share(){ const url=buildLink(), text=buildText(); if(navigator.share){ try{ await navigator.share({text,url}); return; }catch(e){ if(e.name==='AbortError') return; } } copyLink(); }
async function copyLink(){ const s=buildText()+buildLink(); try{ await navigator.clipboard.writeText(s); toast('Copied — paste it into a message'); }catch(e){ prompt('Copy this:', s); } }

// ---------- Received ----------
function renderReceived(param){
  const items=param.split(',').map(s=>meal(s.includes('.')?s.split('.')[1]:s)).filter(Boolean);
  if(!items.length) return false;
  $('recvTitle').textContent=`What's for ${mealTime()}?`;
  $('recvSub').textContent = items.length>1 ? 'Two ideas — which one?' : 'One idea.';
  $('recvCards').innerHTML = items.map((m,i)=>`<div class="meal"><div class="photo">${img('img/'+m.id+'.jpg', emojiFor(m))}</div><div class="body">${items.length>1?`<div class="pill">Option ${i+1}</div>`:''}<h2>${m.name}</h2><ul class="ing" style="margin-top:10px">${m.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul></div></div>`).join('');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $('received').classList.add('on');
  return true;
}

// ---------- Boot ----------
renderHome();
const p=new URLSearchParams(location.search).get('p');
if(!(p && renderReceived(p))){ $('home').classList.add('on'); history.replaceState({s:'home'},''); }
</script>
